name: Datenbankmigration

# Zwei Wege, einer je Umgebung:
#
#   Stage       laeuft von selbst, sobald etwas auf den Zweig "stage"
#               gepusht wird. Dort soll ausprobiert werden, und eine
#               Migration, die einen Handgriff braucht, wird nicht
#               ausprobiert.
#
#   Produktiv   nur von Hand, mit Bestaetigung und - sofern in den
#               Umgebungsregeln hinterlegt - mit Freigabe. Eine
#               Schemaaenderung auf der produktiven Datenbank ist eine
#               Entscheidung, kein Nebeneffekt eines Pushes
#               (Konzeptpunkt 34).
#
# Beide holen DATABASE_URL aus der jeweiligen GitHub-Umgebung. Derselbe
# Name, zwei Werte - so kann kein Lauf versehentlich auf der falschen
# Datenbank landen.

on:
  push:
    branches: [stage]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      umgebung:
        description: 'Welche Datenbank'
        required: true
        type: choice
        options: [stage, produktion]
      aktion:
        description: 'status zeigt nur an, up spielt ein'
        required: true
        default: status
        type: choice
        options: [status, up]
      bestaetigung:
        description: 'Fuer "up" auf der Produktion: "migrieren" eintippen'
        required: false
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'stage' || inputs.umgebung }}

    steps:
      - name: Bestaetigung fuer die Produktion pruefen
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.umgebung == 'produktion'
          && inputs.aktion == 'up'
          && inputs.bestaetigung != 'migrieren'
        run: |
          echo "Abgebrochen: Bestaetigung fehlt oder stimmt nicht."
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Zuerst immer anzeigen, was ansteht - auch beim Einspielen. Das
      # Protokoll des Laufs soll spaeter beantworten, was passiert ist.
      - name: Stand anzeigen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs status

      # Jede Migration ruft am Ende apply_tenant_rls() und
      # assert_rls_complete() auf. Eine Migration, die eine Mandantentabelle
      # anlegt und sie nicht absichert, bricht den Lauf hier ab - in jeder
      # Umgebung, auch wenn sie jemand von Hand einspielt.
      - name: Migrationen einspielen
        if: github.event_name == 'push' || inputs.aktion == 'up'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs up

      - name: Stand danach
        if: github.event_name == 'push' || inputs.aktion == 'up'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs status
