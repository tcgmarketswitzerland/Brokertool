name: Datenbankmigration

# Bewusst nur manuell ausloesbar. Migrationen laufen nie automatisch bei
# jedem Push - eine Schemaaenderung auf der produktiven Datenbank ist eine
# Entscheidung, kein Nebeneffekt (Konzeptpunkt 34).
on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: 'Zum Bestaetigen "migrieren" eintippen'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production      # erlaubt spaeter eine Freigabe vor dem Lauf

    steps:
      - name: Bestaetigung pruefen
        if: inputs.bestaetigung != 'migrieren'
        run: |
          echo "Abgebrochen: Bestaetigung fehlt oder falsch."
          exit 1

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Projekt verbinden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Ausstehende Migrationen anzeigen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      - name: Migrationen anwenden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # Der Policy-Generator wird nach jeder Migration erneut ausgefuehrt,
      # damit neue Mandantentabellen ihr Policy-Set zuverlaessig bekommen
      # (Architektur 8.3). Ohne diesen Schritt haengt die Absicherung daran,
      # dass jemand daran denkt.
      - name: Mandanten-Policies erzeugen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --include-all --dry-run > /dev/null 2>&1 || true
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 \
            -c "select public.apply_tenant_rls();"

      - name: Nachweis - keine Tabelle ohne RLS
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -t -c "
            select coalesce(string_agg(c.relname, ', '), '')
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'r'
               and (not c.relrowsecurity or not c.relforcerowsecurity)
          " | tee /tmp/offenders.txt
          if [ -s /tmp/offenders.txt ] && [ -n "$(tr -d '[:space:]' < /tmp/offenders.txt)" ]; then
            echo "Tabellen ohne vollstaendiges RLS: $(cat /tmp/offenders.txt)"
            exit 1
          fi
          echo "RLS vollstaendig."
