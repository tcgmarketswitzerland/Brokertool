name: Datenbankmigration

# Bewusst nur manuell ausloesbar. Eine Schemaaenderung auf der produktiven
# Datenbank ist eine Entscheidung, kein Nebeneffekt eines Pushes
# (Konzeptpunkt 34).
on:
  workflow_dispatch:
    inputs:
      bestaetigung:
        description: 'Zum Bestaetigen "migrieren" eintippen'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production      # erlaubt spaeter eine Freigabe vor dem Lauf

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Bestaetigung pruefen
        if: inputs.bestaetigung != 'migrieren'
        run: |
          echo "Abgebrochen: Bestaetigung fehlt oder falsch."
          exit 1

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Projekt verbinden
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Ausstehende Migrationen anzeigen
        run: supabase migration list

      # Die Absicherung braucht keinen eigenen Schritt mehr: jede Migration
      # ruft am Ende apply_tenant_rls() und assert_rls_complete() auf. Eine
      # Migration, die eine Mandantentabelle anlegt und sie nicht absichert,
      # schlaegt damit hier fehl - und zwar in jeder Umgebung, auch wenn sie
      # jemand von Hand einspielt.
      - name: Migrationen anwenden
        run: supabase db push

      - name: Ergebnis
        run: supabase migration list
